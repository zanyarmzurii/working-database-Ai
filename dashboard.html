<!DOCTYPE html>
<html lang="kmr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبۆردا کنترۆڵا دوکانێ - Kurdish AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap');
        body { font-family: 'Noto Sans Arabic', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">داشبۆردا کنترۆڵا AI (بادینی)</h1>
                    <p class="text-xs text-slate-400">سیستەمێ ئۆتۆماتیکی یێ بەرسڤدانا فرە-پلاتفۆرم</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    سێرڤەر یێ چالاکە
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="lg:col-span-1 bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl">
            <h2 class="text-lg font-bold text-indigo-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> زێدەکرنا کەلوپەلێ نوی
            </h2>
            <form id="productForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ناڤێ کەلوپەلێ</label>
                    <input type="text" id="pName" placeholder="نموونە: کابۆیا ڕەش" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">نرخ (IQD)</label>
                    <input type="text" id="pPrice" placeholder="نموونە: 25,000 IQD" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">لینکێ وێنەیی (URL)</label>
                    <input type="url" id="pImage" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">دۆخ د کۆگایێ دا</label>
                    <select id="pStock" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                        <option value="true">بەردەستە (In Stock)</option>
                        <option value="false">نەمایە (Out of Stock)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-save"></i> پاشکەوتکرن بۆ داتابەیسێ
                </button>
            </form>
        </div>

        <div class="lg:col-span-2 space-y-6">
            
            <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked"></i> لیستا کەلوپەلێن دوکانێ
                    </h2>
                    <span id="pCount" class="text-xs bg-slate-700 px-2.5 py-1 rounded-lg">3 پارچە</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-900/50 text-slate-400 text-xs">
                            <tr>
                                <th class="p-3 rounded-r-lg">وێنە</th>
                                <th class="p-3">ناڤ</th>
                                <th class="p-3">نرخ</th>
                                <th class="p-3">بارودۆخ</th>
                            </tr>
                        </thead>
                        <tbody id="productsTable" class="divide-y divide-slate-700/50">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl">
                <h2 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> داواکاریێن هاتی (Orders)
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-900/50 text-slate-400 text-xs">
                            <tr>
                                <th class="p-3 rounded-r-lg">کۆد</th>
                                <th class="p-3">کڕیار</th>
                                <th class="p-3">ژمارا تەلەفۆنێ</th>
                                <th class="p-3">پلاتفۆرم</th>
                                <th class="p-3">کەلوپەل</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable" class="divide-y divide-slate-700/50">
                            <tr class="hover:bg-slate-700/30">
                                <td class="p-3 font-mono text-emerald-400">ORD-1092</td>
                                <td class="p-3 font-semibold">ئەحمەد دهۆکی</td>
                                <td class="p-3 dir-ltr text-right">0750 123 4567</td>
                                <td class="p-3 text-indigo-400">WhatsApp</td>
                                <td class="p-3">کابۆیا پیاوان</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        const defaultProducts = [
            { id: 101, name: "کابۆیا پیاوان", price: "25,000 IQD", inStock: true, image: "https://images.unsplash.com/photo-1542272604-780c36856842?w=600" },
            { id: 102, name: "قەمیصێ سپی", price: "18,000 IQD", inStock: true, image: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=600" },
            { id: 103, name: "سۆئیتەرێ زڤستانێ", price: "35,000 IQD", inStock: false, image: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?w=600" }
        ];

        function renderProducts() {
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = defaultProducts.map(p => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="p-3">
                        <img src="${p.image}" class="w-10 h-10 rounded-lg object-cover bg-slate-900 border border-slate-700">
                    </td>
                    <td class="p-3 font-semibold">${p.name}</td>
                    <td class="p-3 text-indigo-300 font-bold">${p.price}</td>
                    <td class="p-3">
                        ${p.inStock ? 
                            '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-xs">بەردەستە</span>' : 
                            '<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded text-xs">نەمایە</span>'}
                    </td>
                </tr>
            `).join('');
            document.getElementById('pCount').innerText = `${defaultProducts.length} پارچە`;
        }

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const image = document.getElementById('pImage').value || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600';
            const inStock = document.getElementById('pStock').value === 'true';

            defaultProducts.unshift({ id: Date.now(), name, price, image, inStock });
            renderProducts();
            e.target.reset();
        });

        renderProducts();
    </script>
</body>
</html>
